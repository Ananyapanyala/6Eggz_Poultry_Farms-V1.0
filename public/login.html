<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · 6EGGZ</title><link rel="stylesheet" href="/theme.css"><style>
body{min-height:100vh;display:grid;place-items:center;margin:0;background:var(--bg,#faf8f0);color:var(--text,#1e2b22);font-family:var(--sans,system-ui,sans-serif)}main{width:min(92vw,430px);box-sizing:border-box;background:#fff;border:1px solid #e2e6dc;border-radius:20px;padding:34px;box-shadow:0 18px 48px #172c1912}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;font-weight:800;letter-spacing:.04em}.brand-mark{display:grid;place-items:center;background:#22543a;color:#fff;border-radius:12px;width:44px;height:44px}.brand small{display:block;font-size:10px;letter-spacing:.14em;color:#6d7a6e}h1{font-family:Georgia,serif;font-size:34px;line-height:1.1;margin:28px 0 10px}.sub{color:#68746b;font-size:14px;line-height:1.6;margin:0 0 24px}input,button{box-sizing:border-box;width:100%;height:48px;border-radius:10px;font:inherit}input{padding:0 14px;border:1px solid #ccd5cb;background:#fff;color:#18231b;margin:0 0 10px}button{border:0;background:#22543a;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}button.alt{background:#f1f3ed;color:#34523e}button:disabled{opacity:.55;cursor:wait}.msg{font-size:13px;line-height:1.5;min-height:20px;color:#617064}.msg.err{color:#a33a2b}#passkey{margin-top:18px}[hidden]{display:none!important}.fine{font-size:12px;color:#7b857b;margin-top:24px}
</style></head><body><main><a class="brand" href="/"><span class="brand-mark">6E</span><span>6EGGZ<small>POULTRY FARMS</small></span></a><h1 id="title">Welcome back.</h1><p class="sub" id="sub">Sign in securely with a one-time code sent to your email. No password required.</p><form id="form" novalidate><div id="email-row"><input id="email" name="email" type="email" placeholder="Email address" autocomplete="username webauthn" autocapitalize="off" spellcheck="false" required aria-label="Email address"></div><div id="code-row" hidden><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" aria-label="6-digit code"></div><button id="submit" type="submit">Continue</button><button id="back" class="alt" type="button" hidden>Use a different email</button></form><div id="passkey" hidden><p class="sub">Add a passkey and next time sign in with your fingerprint, face, or device screen lock.</p><button id="passkey-add" type="button">Add a passkey</button><button id="passkey-skip" class="alt" type="button">Not now</button></div><p id="msg" class="msg" role="status" aria-live="polite"></p><p class="fine">By signing in, you can access your own 6EGGZ orders and account details.</p></main>
<script>
(function(){const A=window.hatchable&&window.hatchable.auth,$=id=>document.getElementById(id);const form=$("form"),email=$("email"),code=$("code"),emailRow=$("email-row"),codeRow=$("code-row"),submit=$("submit"),back=$("back"),msg=$("msg"),title=$("title"),sub=$("sub"),passkey=$("passkey");let step="email",hasPasskey=false;const declinedKey="6eggz_passkey_offer_declined";function say(t,err){msg.textContent=t||"";msg.className="msg"+(err?" err":"")}function next(){const n=new URLSearchParams(location.search).get("next")||"/";return n.startsWith("/")&&!n.startsWith("//")?n:"/"}function done(){location.replace(next())}function declined(){try{return localStorage.getItem(declinedKey)==="1"}catch(e){return false}}function decline(){try{localStorage.setItem(declinedKey,"1")}catch(e){}}function finish(){if(hasPasskey||declined()||!A.supportsPasskeys||!A.supportsPasskeys()){done();return}form.hidden=true;title.textContent="You're signed in";sub.textContent="Your 6EGGZ customer account is ready.";passkey.hidden=false;say("")}
if(!A){say("Sign-in is unavailable right now. Please refresh.",true);submit.disabled=true;return}
A.getSession().then(s=>{if(s&&s.user)done()}).catch(()=>{});
if(A.attachPasskeyAutofill){try{A.attachPasskeyAutofill(email).then(r=>{if(r&&r.user)done()}).catch(()=>{})}catch(e){}}
$("passkey-add").addEventListener("click",()=>{const a=$("passkey-add");a.disabled=true;$("passkey-skip").disabled=true;A.registerPasskey().then(r=>{if(!r)decline();done()}).catch(e=>{a.disabled=false;$("passkey-skip").disabled=false;say(e.message||"Could not save the passkey. You can continue without one.",true)})});$("passkey-skip").addEventListener("click",()=>{decline();done()});
back.addEventListener("click",()=>{step="email";codeRow.hidden=true;emailRow.hidden=false;back.hidden=true;submit.textContent="Continue";sub.textContent="Sign in securely with a one-time code sent to your email. No password required.";say("");email.focus()});
form.addEventListener("submit",e=>{e.preventDefault();submit.disabled=true;if(step==="email"){const em=email.value.trim();if(!em){submit.disabled=false;say("Enter your email address.",true);return}A.startLogin({email:em}).then(r=>{hasPasskey=!!(r&&r.has_passkey);if(hasPasskey&&A.supportsPasskeys&&A.supportsPasskeys())return A.signInWithPasskey({email:em}).then(d=>{if(d&&d.user){done();return null}return"code"}).catch(()=>"code");return"code"}).then(v=>{if(v!=="code")return;step="code";emailRow.hidden=true;codeRow.hidden=false;back.hidden=false;submit.textContent="Sign in";sub.textContent="Enter the 6-digit code sent to "+em+".";say("Code sent. It expires in 10 minutes.");code.focus()}).catch(err=>say(err&&err.status===429?"Too many attempts. Please try again shortly.":(err.message||"Could not send a code. Check the email and try again."),true)).then(()=>{submit.disabled=false});return}A.verifyCode({email:email.value.trim(),code:code.value.trim()}).then(d=>{if(d&&d.user){finish();return}say("That code did not work. Try again.",true)}).catch(err=>say(err.message||"That code did not work. Try again.",true)).then(()=>{submit.disabled=false})});email.focus()})();
</script></body></html>
